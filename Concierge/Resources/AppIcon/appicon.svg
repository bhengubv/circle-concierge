<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
    Concierge app icon — background plate. Bell on a warm radial halo
    (sun palette FFF4D6 → FFD76B) so the icon reads as warmth from across
    the Home screen. Per design spec §7.1.

    MAUI splits this into appicon.svg (background) + appiconfg.svg
    (foreground) so the Android adaptive icon system can mask the
    foreground while leaving the background plate static.
-->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="halo" cx="50%" cy="50%" r="60%">
            <stop offset="0%"   stop-color="#FFF4D6"/>
            <stop offset="100%" stop-color="#FFD76B"/>
        </radialGradient>
    </defs>
    <rect width="456" height="456" fill="url(#halo)"/>
</svg>
